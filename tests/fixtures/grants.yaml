# What the DATA PLATFORM reports about access. NOT an approval queue.
#
# The platform approves nothing and owns no data. A data owner grants their data to
# an app's service identity in their OWN system - a Unity Catalog GRANT, a Snowflake
# role, an API key issued by whoever runs that service. This file is our READ of that
# state, and it exists so `insights doctor` can fail early with "ask X" instead of the
# job failing at 06:00 with PERMISSION_DENIED.
#
# Locally it is a fixture, because there is no data platform to query. In dev and prod
# it is populated by querying the real one - which is why nothing here is authoritative
# and why there is no `insights access approve`.
#
# Keyed on IDENTITY, not app name: the identity is what the data platform grants to and
# what appears in its audit.

grants:

  - dataset: hr.compensation
    identity: sp-comp-report          # derived from the app name by the platform,
                                      # never declared by the tenant
    access: read
    # Roles the identity holds in the data platform. Used LOCALLY to approximate the
    # column masks Unity Catalog would apply; in dev and prod UC applies them itself
    # and the broker applies none.
    roles: [comp-analyst]
    granted_by: vidya@corp.example    # a member of MG-PEOPLE-ANALYTICS, who owns it
    granted_at: "2026-09-20T09:14:00Z"
    expires_at: null
    reason: "Weekly compensation equity report. Reviewed by Compliance ref CR-2026-0912."

# --------------------------------------------------------------------------------
# Break-glass - OPERATOR access to tenant data. This IS ours to run, because it is the
# platform team asking, and the brief asks how our own access is granted, constrained
# and evidenced. Time-boxed, approved by the data owner and never by us, audited, and
# the tenant is notified. See ADR-003.
#
# Kept expired so `insights compliance-report` has something real to show a reviewer.
# --------------------------------------------------------------------------------
break_glass:

  - dataset: hr.compensation
    operator: suraj@corp.example      # platform team
    approved_by: vidya@corp.example   # the data owner, and NOT the operator
    requested_at: "2026-09-24T11:02:00Z"
    expires_at:   "2026-09-24T12:02:00Z"
    reason: "comp-report job failing on a malformed row; needed to see the row shape."
    tenant_notified: true
    used: 1
