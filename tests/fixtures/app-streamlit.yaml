# The same guarantees, a different web framework. Proves the SDK is a library
# rather than a framework integration.
apiVersion: v1
app: comp-explorer
team: people-analytics
kind: web
access:
  manage: {owners: [MG-PEOPLE-ANALYTICS]}
  roles:
    - name: comp-analyst
      groups: [MG-PEOPLE-ANALYTICS]
runtime: {sdk: ">=0.1,<1", base: python-streamlit, size: small}
data:
  - {dataset: hr.headcount, access: read}
web: {route: /comp-explorer, type: streamlit}
