apiVersion: v1
app: demo
team: people-analytics
kind: job
access:
  manage:
    owners: [MG-PEOPLE-ANALYTICS]
runtime: {size: medium}
connections:
  - name: team-warehouse
    engine: sqlite
    path: ${INSIGHTS_WAREHOUSE_PATH}
    secret: warehouse-token
job:
  schedule: "0 6 * * MON"
  timezone: Europe/Dublin
  timeout: 30m
  retries: 2
  concurrency: forbid
  catchup: false
